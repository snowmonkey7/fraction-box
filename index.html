<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>凱正老師的遊戲教室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK (Compat v10 for single-file direct browser execution) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 50%, #fde68a 100%);
      min-height: 100vh;
    }
    /* 直式分數排版 */
    .frac-expr {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.35em;
      vertical-align: middle;
    }
    .mixed-num {
      display: inline-flex;
      align-items: center;
      gap: 0.15em;
    }
    .whole-part {
      font-weight: 800;
      font-size: 1.15em;
    }
    .frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.05;
      vertical-align: middle;
      font-weight: 700;
    }
    .frac .num {
      border-bottom: 2.5px solid currentColor;
      padding: 0 5px 2px 5px;
      text-align: center;
    }
    .frac .den {
      padding: 2px 5px 0 5px;
      text-align: center;
    }
    /* 盲盒晃動與發光動畫 */
    @keyframes boxShake {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-10deg) scale(1.06); }
      40% { transform: rotate(10deg) scale(1.08); }
      60% { transform: rotate(-8deg) scale(1.06); }
      80% { transform: rotate(8deg) scale(1.04); }
    }
    .animate-box-shake {
      animation: boxShake 0.75s ease-in-out infinite;
    }
    @keyframes popIn {
      0% { transform: scale(0.4); opacity: 0; }
      75% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop-in {
      animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .hidden-glow {
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.75), 0 0 50px rgba(236, 72, 153, 0.45);
    }
  </style>
</head>
<body class="text-slate-800 select-none">
<header class="bg-white/90 backdrop-blur border-b-4 border-amber-400 sticky top-0 z-30 shadow-sm">
  <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
    <div class="flex items-center gap-2.5">
      <span class="text-3xl">🏫</span>
      <div>
        <h1 class="text-xl md:text-2xl font-black text-amber-700 tracking-wide"><span class="jsSiteTitle"></span></h1>
        <p class="text-xs text-slate-500 font-medium">五年級 數學・國語 學習遊戲</p>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <span id="syncBadge" class="text-xs px-2.5 py-1 rounded-full font-bold bg-slate-100 text-slate-600">連線檢查中...</span>
      <a href="teacher.html" id="btnHeaderTeacher" class="text-sm bg-slate-800 hover:bg-slate-700 text-white font-bold px-3.5 py-1.5 rounded-xl transition shadow">👩‍🏫 教師管理端</a>
      <button id="btnLogout" onclick="indexLogout()" class="hidden text-sm bg-rose-500 hover:bg-rose-600 text-white font-bold px-3.5 py-1.5 rounded-xl transition shadow">登出切換</button>
    </div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-6">

<!-- ==================== 1. 登入畫面 ==================== -->
  <section id="viewLogin" class="max-w-md mx-auto mt-6 bg-white rounded-3xl shadow-xl border-4 border-amber-300 p-7">
    <div class="text-center mb-6">
      <div class="inline-block bg-amber-100 text-amber-800 font-extrabold px-4 py-1 rounded-full text-sm mb-2">五年級學習遊戲</div>
      <h2 class="text-2xl font-black text-slate-800">歡迎來到<span class="jsSiteTitle"></span>！</h2>
      <p class="text-slate-500 text-sm mt-1">請輸入「班級＋座號」和密碼登入</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1">班級座號（共 5 碼，例如 50101）</label>
        <input id="inputStudentId" type="text" inputmode="numeric" maxlength="10" placeholder="請輸入如：50101"
          onkeydown="if(event.key==='Enter') document.getElementById('inputStudentPin').focus()"
          class="w-full text-center text-2xl font-black tracking-widest border-2 border-amber-300 focus:border-amber-500 focus:outline-none rounded-2xl py-3 bg-amber-50/40" />
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1">密碼（4 位數字，請向老師索取）</label>
        <input id="inputStudentPin" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off"
          onkeydown="if(event.key==='Enter') studentLogin()"
          class="w-full text-center text-2xl font-black tracking-[0.5em] border-2 border-amber-300 focus:border-amber-500 focus:outline-none rounded-2xl py-3 bg-amber-50/40" />
      </div>
      <button id="btnStudentLogin" onclick="studentLogin()" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-98 text-white text-lg font-black py-3.5 rounded-2xl shadow-lg shadow-amber-500/30 transition">
        🚀 登入
      </button>
    </div>

    </section>

  <!-- ==================== 遊戲目錄 ==================== -->
  <section id="viewMenu" class="hidden space-y-5">
    <div class="bg-white rounded-3xl p-5 shadow-md border-2 border-amber-200 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-amber-400 text-white text-2xl flex items-center justify-center shadow">🎓</div>
        <div>
          <div class="flex items-center gap-2">
            <span id="menuStuId" class="text-xl font-black text-slate-800"></span>
            <span id="menuStuName" class="text-sm font-bold bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded-lg"></span>
          </div>
          <p class="text-xs text-slate-500 mt-0.5">選一個遊戲開始吧！</p>
        </div>
      </div>
      <div class="bg-amber-50 border-2 border-amber-300 rounded-2xl px-5 py-2 text-center">
        <div class="text-xs font-bold text-amber-700">我的金幣（所有遊戲共用）</div>
        <div class="text-2xl font-black text-amber-600">💰 <span id="menuCoins">0</span></div>
      </div>
    </div>

    <div class="grid md:grid-cols-2 gap-5">
      <a href="fraction.html" class="block bg-white rounded-3xl p-6 shadow-md border-4 border-amber-300 hover:border-amber-500 hover:-translate-y-1 transition">
        <div class="flex items-center justify-between">
          <span class="text-5xl">🎁</span>
          <span class="text-xs font-black bg-sky-100 text-sky-800 px-2.5 py-1 rounded-full">數學</span>
        </div>
        <h3 class="text-2xl font-black text-slate-800 mt-3">分數盲盒店</h3>
        <p class="text-sm text-slate-500 mt-1">異分母分數的加減</p>
        <ul class="text-xs text-slate-600 mt-3 space-y-1">
          <li>• 每答對 3 題就能抽 1 次盲盒，收集全部公仔</li>
          <li>• 抽到重複的公仔，會換成碎片和金幣</li>
        </ul>
        <div class="mt-4 inline-block bg-amber-500 text-white font-black px-5 py-2 rounded-xl shadow">進入遊戲 ➜</div>
      </a>
      <div class="block bg-white/70 rounded-3xl p-6 shadow border-4 border-dashed border-slate-300">
        <div class="flex items-center justify-between">
          <span class="text-5xl grayscale">🏛️</span>
          <span class="text-xs font-black bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full">國語</span>
        </div>
        <h3 class="text-2xl font-black text-slate-500 mt-3">高第的魔法建築</h3>
        <p class="text-sm text-slate-400 mt-1">第七課｜收集妖怪、挑戰守護精靈</p>
        <div class="mt-4 inline-block bg-slate-200 text-slate-500 font-black px-5 py-2 rounded-xl">🔒 即將開放</div>
      </div>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
/* 首頁：登入與遊戲目錄 */
async function studentLogin() {
  const rawId = document.getElementById("inputStudentId").value.trim();
  if (!rawId) {
    alert("請輸入班級座號，例如 50101！");
    return;
  }
  const loginBtn = document.getElementById("btnStudentLogin");
  loginBtn.disabled = true;
  loginBtn.textContent = "⏳ 連線中...";
  let stu;
  try {
    await dbReady;
    if (isCloudMode && cloudError) throw cloudError;
    stu = await fetchStudent(rawId);
    if (!stu) {
      alert("找不到此帳號！請確認輸入 5 碼「班級＋座號」（例如 50101），或請老師在教師端建立帳號。");
      return;
    }
    const inputPin = document.getElementById("inputStudentPin").value.trim();
    if (stu.pin && inputPin !== stu.pin) {
      alert("密碼錯誤！請再試一次，忘記密碼請找老師。");
      document.getElementById("inputStudentPin").value = "";
      document.getElementById("inputStudentPin").focus();
      return;
    }
  } catch (e) {
    reportError("登入", e);
    return;
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "🚀 登入";
  }
  setSessionStudent(stu.id);
  showMenu(stu);
}

function showMenu(stu) {
  document.getElementById("viewLogin").classList.add("hidden");
  document.getElementById("viewMenu").classList.remove("hidden");
  document.getElementById("btnLogout").classList.remove("hidden");
  document.getElementById("menuStuId").textContent = stu.id;
  document.getElementById("menuStuName").textContent = stu.name || "";
  document.getElementById("menuCoins").textContent = stu.coins || 0;
}

function indexLogout() {
  clearSessionStudent();
  document.getElementById("viewMenu").classList.add("hidden");
  document.getElementById("viewLogin").classList.remove("hidden");
  document.getElementById("btnLogout").classList.add("hidden");
  document.getElementById("inputStudentId").value = "";
  document.getElementById("inputStudentPin").value = "";
}

// 已經登入過（例如從遊戲按「遊戲目錄」回來）就直接顯示目錄，並更新金幣
window.onPageReady = async () => {
  const id = getSessionStudentId();
  if (!id) return;
  try {
    if (isCloudMode && cloudError) throw cloudError;
    const stu = await fetchStudent(id);
    if (stu) showMenu(stu); else clearSessionStudent();
  } catch (e) {
    reportError("讀取學生資料", e);
  }
};
</script>
</body>
</html>
